---
name: crs-plugin-lint
description: Lints a CRS plugin's rule files and regression tests

inputs:
  plugin-dir:
    description: Directory holding the plugin's `.conf` rule files
    required: false
    default: plugins
  test-dir:
    description: Directory holding the go-ftw regression tests
    required: false
    default: tests/regression
  python-version:
    description: Python used to run secrules-parser
    required: false
    default: '3.x'

runs:
  using: composite
  steps:
    - name: Lint YAML
      uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # pin@v3.1.1
      with:
        format: github
        file_or_dir: ${{ inputs.test-dir }}
        config_data: |
          extends: default
          rules:
            new-line-at-end-of-file:
              level: warning
            trailing-spaces:
              level: warning
            line-length:
              max: 1024
              level: warning
            indentation: disable
            comments:
              require-starting-space: true # default
              min-spaces-from-content: 1

    - name: Check end of files
      shell: bash
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/check-eof.sh" .

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # pin@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check plugin syntax
      shell: bash
      env:
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
      run: |
        set -euo pipefail
        pip install --upgrade setuptools
        pip install secrules-parsing
        "$GITHUB_ACTION_PATH/lint-rules.sh" "$PLUGIN_DIR"
